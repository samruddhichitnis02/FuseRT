<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340" style="background:#0d1117; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-gemm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-kgen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <text x="30" y="35" fill="#f1f5f9" font-size="16" font-weight="700">TensorRT Profiling: Where Does GPU Execution Time Actually Go?</text>
  <text x="30" y="55" fill="#94a3b8" font-size="12">197 Compiled TensorRT Layers Profiled at Batch 1 | RTX 3060 Laptop GPU (FP32) | Total Time: 6.90 ms</text>

  <text x="30" y="90" fill="#cbd5e1" font-size="13" font-weight="600">TensorRT Engine Layer Composition</text>
  
  <rect x="30" y="105" width="460" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <rect x="30" y="105" width="328" height="34" rx="6" fill="url(#grad-gemm)"/>
  <text x="194" y="126" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">GEMMs: 71.4% (4.93 ms)</text>

  <rect x="358" y="105" width="106" height="34" fill="url(#grad-kgen)"/>
  <text x="411" y="126" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">kgen 23%</text>

  <rect x="464" y="105" width="26" height="34" rx="0 6 6 0" fill="#64748b"/>

  <text x="30" y="160" fill="#94a3b8" font-size="11">• 73 Matrix Multiplications (GEMMs) dominate raw compute</text>
  <text x="30" y="178" fill="#94a3b8" font-size="11">• 75 TensorRT Generated Kernels (kgen) handle elementwise ops &amp; softmax</text>
  <text x="30" y="196" fill="#94a3b8" font-size="11">• 49 Casts, Reshapes &amp; Shape calls make up the remaining 5.7%</text>

  <!-- Right: The Attention Discovery Box -->
  <rect x="520" y="80" width="330" height="235" rx="10" fill="#161b22" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="535" y="95" width="160" height="22" rx="4" fill="#831843"/>
  <text x="615" y="110" fill="#f472b6" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">THE 23% HOTSPOT</text>

  <text x="535" y="140" fill="#ffffff" font-size="14" font-weight="700">Central Attention Path: 1.586 ms</text>
  <text x="535" y="158" fill="#ec4899" font-size="13" font-weight="800">23.0% of Total Profiled Layer Time</text>

  <g transform="translate(535, 175)">
    <text x="0" y="15" fill="#e2e8f0" font-size="11">Q × Kᵀ GEMMs (12 layers)</text>
    <text x="230" y="15" fill="#f472b6" font-size="11" font-weight="700">0.658 ms (9.5%)</text>

    <text x="0" y="38" fill="#e2e8f0" font-size="11">Masked Softmax (12 layers)</text>
    <text x="230" y="38" fill="#f472b6" font-size="11" font-weight="700">0.417 ms (6.0%)</text>

    <text x="0" y="61" fill="#e2e8f0" font-size="11">Scores × V GEMMs (12 layers)</text>
    <text x="230" y="61" fill="#f472b6" font-size="11" font-weight="700">0.511 ms (7.4%)</text>

    <line x1="0" y1="75" x2="300" y2="75" stroke="#374151" stroke-width="1"/>
    
    <text x="0" y="95" fill="#34d399" font-size="12" font-weight="700">Combined Fused-Kernel Target</text>
    <text x="230" y="95" fill="#34d399" font-size="12" font-weight="800">1.586 ms</text>
  </g>

  <rect x="30" y="235" width="460" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="45" y="258" fill="#38bdf8" font-size="12" font-weight="700">💡 Why Not Residual + LayerNorm?</text>
  <text x="45" y="278" fill="#94a3b8" font-size="11">Profiling revealed Residual+LayerNorm only takes 0.545 ms (7.9%).</text>
  <text x="45" y="296" fill="#94a3b8" font-size="11">Targeting Attention tackles nearly 3x more execution time (1.586 ms)!</text>
</svg>