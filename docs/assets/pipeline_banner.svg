<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220" style="background:#0d1117; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      .pulse-line {
        stroke-dasharray: 8 6;
        animation: dash 1.5s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -28; }
      }
      .node-card {
        transition: transform 0.3s ease;
      }
      .node-card:hover {
        transform: translateY(-4px);
      }
    </style>
  </defs>

  <!-- Title Badge -->
  <rect x="30" y="20" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="37" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">END-TO-END PIPELINE</text>

  <!-- Connecting Lines -->
  <line x1="200" y1="120" x2="260" y2="120" stroke="#38bdf8" stroke-width="2" class="pulse-line" opacity="0.8"/>
  <line x1="430" y1="120" x2="490" y2="120" stroke="#c084fc" stroke-width="2" class="pulse-line" opacity="0.8"/>
  <line x1="660" y1="120" x2="720" y2="120" stroke="#34d399" stroke-width="2" class="pulse-line" opacity="0.8"/>

  <!-- Step 1: PyTorch Model -->
  <g class="node-card" transform="translate(30, 65)">
    <rect width="170" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="url(#grad-amber)"/>
    <text x="30" y="38" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Py</text>
    <text x="58" y="28" fill="#f1f5f9" font-size="14" font-weight="700">PyTorch</text>
    <text x="58" y="44" fill="#94a3b8" font-size="11">BERT-base (FP32)</text>
    <line x1="12" y1="62" x2="158" y2="62" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="80" fill="#64748b" font-size="11">12 Layers • 110M params</text>
    <text x="14" y="98" fill="#38bdf8" font-size="11" font-weight="600">Export to ONNX ➔</text>
  </g>

  <!-- Step 2: Raw ONNX -->
  <g class="node-card" transform="translate(260, 65)">
    <rect width="170" height="110" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="url(#grad-blue)"/>
    <text x="30" y="38" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ONNX</text>
    <text x="58" y="28" fill="#f1f5f9" font-size="14" font-weight="700">Raw Graph</text>
    <text x="58" y="44" fill="#ef4444" font-size="11" font-weight="600">1,231 Nodes</text>
    <line x1="12" y1="62" x2="158" y2="62" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="80" fill="#94a3b8" font-size="11">Scattered math ops</text>
    <text x="14" y="98" fill="#f87171" font-size="11">Heavy launch overhead</text>
  </g>

  <!-- Step 3: FuseRT Optimization -->
  <g class="node-card" transform="translate(490, 65)">
    <rect width="170" height="110" rx="10" fill="#161b22" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="url(#grad-purple)"/>
    <text x="30" y="38" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">FUSE</text>
    <text x="58" y="28" fill="#f1f5f9" font-size="14" font-weight="700">FuseRT Engine</text>
    <text x="58" y="44" fill="#c084fc" font-size="11" font-weight="600">4 Custom Passes</text>
    <line x1="12" y1="62" x2="158" y2="62" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="80" fill="#34d399" font-size="11" font-weight="700">-632 Nodes (-51.3%)</text>
    <text x="14" y="98" fill="#94a3b8" font-size="11">Down to 599 Nodes</text>
  </g>

  <!-- Step 4: Backend Engines -->
  <g class="node-card" transform="translate(720, 65)">
    <rect width="210" height="110" rx="10" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="url(#grad-emerald)"/>
    <text x="30" y="38" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">GPU</text>
    <text x="58" y="28" fill="#f1f5f9" font-size="14" font-weight="700">RTX 3060 Laptop</text>
    <text x="58" y="44" fill="#34d399" font-size="11" font-weight="600">Exact Math (2.19e-5)</text>
    <line x1="12" y1="62" x2="198" y2="62" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="80" fill="#38bdf8" font-size="11">ORT CUDA: <tspan fill="#34d399" font-weight="bold">2.1x Faster (7.39 ms)</tspan></text>
    <text x="14" y="98" fill="#fbbf24" font-size="11">TensorRT: <tspan fill="#ffffff" font-weight="bold">3.83 ms (Batch 1)</tspan></text>
  </g>
</svg>