<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340" style="background:#0d1117; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="vram-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <style>
      .slow-traffic {
        stroke-dasharray: 6 4;
        animation: slowFlow 2s linear infinite;
      }
      @keyframes slowFlow {
        to { stroke-dashoffset: -20; }
      }
    </style>
  </defs>

  <text x="30" y="35" fill="#f1f5f9" font-size="16" font-weight="700">Why Fused Attention? Memory Bandwidth vs. On-Chip SRAM</text>
  <text x="30" y="55" fill="#94a3b8" font-size="12">Eliminating intermediate GPU VRAM round-trips for [Batch, 12, 128, 128] attention scores</text>

  <!-- LEFT -->
  <g transform="translate(30, 75)">
    <rect width="390" height="240" rx="10" fill="#161b22" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="22" rx="4" fill="#450a0a"/>
    <text x="90" y="30" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">STANDARD TENSORRT</text>

    <rect x="25" y="55" width="95" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="72" y="75" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Kernel 1</text>
    <text x="72" y="88" fill="#94a3b8" font-size="9" text-anchor="middle">Q × Kᵀ GEMM</text>

    <rect x="145" y="55" width="95" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="192" y="75" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Kernel 2</text>
    <text x="192" y="88" fill="#94a3b8" font-size="9" text-anchor="middle">Softmax</text>

    <rect x="265" y="55" width="95" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="312" y="75" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Kernel 3</text>
    <text x="312" y="88" fill="#94a3b8" font-size="9" text-anchor="middle">Scores × V</text>

    <rect x="25" y="150" width="335" height="40" rx="6" fill="url(#vram-grad)"/>
    <text x="192" y="175" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">Global GPU VRAM (DRAM) — High Latency Bottleneck</text>

    <path d="M 72 95 L 72 150" stroke="#f87171" stroke-width="2" class="slow-traffic"/>
    <path d="M 170 150 L 170 95" stroke="#f87171" stroke-width="2" class="slow-traffic"/>
    <path d="M 215 95 L 215 150" stroke="#f87171" stroke-width="2" class="slow-traffic"/>
    <path d="M 312 150 L 312 95" stroke="#f87171" stroke-width="2" class="slow-traffic"/>

    <text x="192" y="215" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">⚠️ 3 separate kernel launches + 2 full VRAM round-trips</text>
  </g>

  <!-- RIGHT -->
  <g transform="translate(460, 75)">
    <rect width="390" height="240" rx="10" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="22" rx="4" fill="#064e3b"/>
    <text x="100" y="30" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">FUSERT FUSED ATTENTION</text>

    <rect x="25" y="55" width="340" height="135" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" opacity="0.9"/>
    <text x="195" y="85" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Single Fused CUDA Attention Kernel</text>
    
    <rect x="45" y="105" width="300" height="45" rx="6" fill="#047857"/>
    <text x="195" y="128" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">On-Chip Shared Memory (SRAM / Registers)</text>
    <text x="195" y="142" fill="#a7f3d0" font-size="10" text-anchor="middle">Intermediate scores stay on chip (19 TB/s effective bandwidth)</text>

    <text x="195" y="178" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">Q, K, V in ➔ Softmax scaled ➔ Context Out</text>

    <text x="195" y="215" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">✨ 1 Kernel Launch | 0 Intermediate VRAM Round-trips</text>
  </g>
</svg>