<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340" style="background:#0d1117; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="orig-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="fuse-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <text x="30" y="35" fill="#f1f5f9" font-size="16" font-weight="700">ONNX Runtime CUDA Latency (ms) — Isolated Graph Compiler Impact</text>
  <text x="30" y="55" fill="#94a3b8" font-size="12">NVIDIA GPU | FP32 | Seq Length 128 | Runtime Graph Optimizer OFF (Shows True Pass Impact)</text>

  <!-- Legend -->
  <rect x="580" y="25" width="16" height="16" rx="4" fill="url(#orig-grad)"/>
  <text x="605" y="38" fill="#e2e8f0" font-size="12">Original Export</text>
  <rect x="710" y="25" width="16" height="16" rx="4" fill="url(#fuse-grad)"/>
  <text x="735" y="38" fill="#34d399" font-size="12" font-weight="600">FuseRT Optimized</text>

  <!-- Grid lines -->
  <line x1="80" y1="260" x2="830" y2="260" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="210" x2="830" y2="210" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="80" y1="160" x2="830" y2="160" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="80" y1="110" x2="830" y2="110" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="70" y="264" fill="#64748b" font-size="11" text-anchor="end">0 ms</text>
  <text x="70" y="214" fill="#64748b" font-size="11" text-anchor="end">40 ms</text>
  <text x="70" y="164" fill="#64748b" font-size="11" text-anchor="end">80 ms</text>
  <text x="70" y="114" fill="#64748b" font-size="11" text-anchor="end">120 ms</text>

  <!-- Batch 1 Cluster -->
  <g transform="translate(140, 0)">
    <rect x="0" y="240" width="55" height="20" rx="4" fill="url(#orig-grad)"/>
    <text x="27" y="233" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">15.68</text>

    <rect x="65" y="250" width="55" height="10" rx="4" fill="url(#fuse-grad)"/>
    <text x="92" y="243" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">7.39</text>

    <text x="60" y="285" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Batch 1</text>
    <text x="60" y="302" fill="#64748b" font-size="11" text-anchor="middle">Interactive / Realtime</text>

    <!-- Speedup Badge -->
    <rect x="15" y="175" width="90" height="34" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="60" y="196" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle">2.1x FASTER</text>
    <path d="M 60 210 L 60 225" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Batch 8 Cluster -->
  <g transform="translate(390, 0)">
    <rect x="0" y="214" width="55" height="46" rx="4" fill="url(#orig-grad)"/>
    <text x="27" y="206" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">36.68</text>

    <rect x="65" y="223" width="55" height="37" rx="4" fill="url(#fuse-grad)"/>
    <text x="92" y="215" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">29.38</text>

    <text x="60" y="285" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Batch 8</text>
    <text x="60" y="302" fill="#64748b" font-size="11" text-anchor="middle">Serving Throughput</text>

    <rect x="25" y="165" width="70" height="26" rx="5" fill="#161b22" stroke="#38bdf8" stroke-width="1"/>
    <text x="60" y="182" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">-20% Latency</text>
  </g>

  <!-- Batch 32 Cluster -->
  <g transform="translate(640, 0)">
    <rect x="0" y="97" width="55" height="163" rx="4" fill="url(#orig-grad)"/>
    <text x="27" y="89" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">130.32</text>

    <rect x="65" y="127" width="55" height="133" rx="4" fill="url(#fuse-grad)"/>
    <text x="92" y="119" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">106.10</text>

    <text x="60" y="285" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Batch 32</text>
    <text x="60" y="302" fill="#64748b" font-size="11" text-anchor="middle">High Batch / Offline</text>

    <rect x="25" y="55" width="70" height="26" rx="5" fill="#161b22" stroke="#38bdf8" stroke-width="1"/>
    <text x="60" y="72" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">-24.2 ms</text>
  </g>
</svg>